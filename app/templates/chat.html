<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b6e5f">
  <title>Meisterli – Chat (Demo)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='16' fill='%230b6e5f'/><text x='16' y='22' font-family='Arial' font-size='17' font-weight='700' fill='white' text-anchor='middle'>M</text></svg>">
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body>
<div class="buehne">
  <div class="handy" id="handy">
    <header class="kopf">
      <a class="zurueck" href="/rechnungen" title="Zur Verwaltung" aria-label="Zur Verwaltung">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="40" height="40">
          <circle cx="20" cy="20" r="20" fill="#f4c542"/>
          <path d="M11 29V13l9 9 9-9v16" fill="none" stroke="#1f2c34" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="titel">
        <div class="name">Meisterli <span class="demo">Demo</span></div>
        <div class="status" id="status">online</div>
      </div>
      <button class="menue-knopf" id="menue-knopf" aria-label="Menü" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
      </button>
      <nav class="menue" id="menue" hidden>
        <button type="button" data-aktion="leeren">Chat leeren</button>
        <button type="button" data-aktion="zuruecksetzen">Alles zurücksetzen</button>
        <hr>
        <a href="/wissen">Wissen</a>
        <a href="/rechnungen">Rechnungen</a>
        <a href="/einstellungen">Einstellungen</a>
      </nav>
    </header>

    <main class="verlauf" id="verlauf" aria-live="polite">
      <div class="hinweis-verschluesselt">Demo · alles läuft lokal auf diesem Mac</div>
      <div id="nachrichten"></div>
      <div class="zeile-links" id="tippt" hidden>
        <div class="blase meisterli tippt" aria-label="Meisterli schreibt"><span></span><span></span><span></span></div>
      </div>
    </main>

    <footer class="eingabe" id="eingabe">
      <div class="feld" id="feld-normal">
        <button type="button" class="rund klein" id="anhang" aria-label="Audiodatei anhängen" title="Audiodatei anhängen">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M16.5 6.5v10a4.5 4.5 0 0 1-9 0V5.8a3 3 0 0 1 6 0v10a1.5 1.5 0 0 1-3 0V7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <textarea id="text" rows="1" placeholder="Nachricht" aria-label="Nachricht"></textarea>
        <input type="file" id="datei" accept=".ogg,.opus,.m4a,.mp3,.wav,.webm,.mp4,.aac,audio/*" hidden>
      </div>
      <div class="feld aufnahme" id="feld-aufnahme" hidden>
        <button type="button" class="rund klein" id="abbrechen" aria-label="Aufnahme verwerfen" title="Verwerfen">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="punkt"></span>
        <span class="laufzeit" id="laufzeit">0:00</span>
        <span class="leise-text">Aufnahme läuft – tippe zum Senden</span>
      </div>
      <button type="button" class="rund senden" id="senden" aria-label="Aufnehmen">
        <svg class="icon-mikro" viewBox="0 0 24 24" width="24" height="24"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-senden" viewBox="0 0 24 24" width="24" height="24"><path d="M4 12 20 4l-4 16-4-6.5L4 12Z" fill="currentColor"/></svg>
      </button>
    </footer>
  </div>
</div>
<script src="/static/chat.js"></script>
</body>
</html>
